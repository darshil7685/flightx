# Render Blueprint — deploy both services from one repo.
# Dashboard: New → Blueprint → connect this repo.
# Set secret env vars (COGNODB_*, VITE_API_URL, CORS_ORIGIN) in the Render UI.

services:
  - type: web
    name: flightx-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COGNODB_URI
        sync: false
      - key: COGNODB_USER
        sync: false
      - key: COGNODB_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: flightx-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
